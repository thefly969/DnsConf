name: Build and test

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "26"
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install DNS-over-TLS dependency
        run: python -m pip install --disable-pip-version-check dnspython==2.7.0

      - name: Test DNS resolver country filtering
        run: python -m unittest discover -s tests -v

      - name: Generate and validate ChatGPT/Gemini DNS candidates
        run: python scripts/generate_dns_hosts.py

      - name: Build and run unit tests
        run: mvn -B -ntp clean verify
