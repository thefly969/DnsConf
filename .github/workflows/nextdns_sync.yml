name: NextDNS SMART Rewrite Sync

on:
  push:
    branches: [main, feat/dnshostsgenerator-dot-sync]
    paths: ['.github/workflows/nextdns_sync.yml', 'scripts/**', 'src/**', 'pom.xml']
  schedule:
    - cron: '0 3 * * *'
      timezone: Europe/Zurich
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate and report changes without modifying NextDNS"
        type: boolean
        required: true
        default: true

permissions:
  contents: write

concurrency:
  group: nextdns-clean-workflow-v2
  cancel-in-progress: false

jobs:
  sync:
    name: sync
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: DNS
    env:
      DNS: NEXTDNS
      DRY_RUN: ${{ github.ref != 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
      BLOCK: ${{ vars.BLOCK }}
      REDIRECT: https://raw.githubusercontent.com/Noktomezo/RussiaFancyLists/main/lists/hosts/smart-no-crutch.hosts
      REDIRECT_CANDIDATES: https://raw.githubusercontent.com/Noktomezo/RussiaFancyLists/main/lists/hosts/combined-no-crutch.hosts
      REDIRECT_FALLBACK: file://${{ github.workspace }}/generated/dnshostsgenerator.hosts
      EXCLUDE_REDIRECT: ${{ vars.EXCLUDE_REDIRECT }}
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      TZ: Europe/Zurich
    steps:
      - name: Validate NextDNS configuration
        shell: bash
        run: |
          test -n "$CLIENT_ID" || { echo "::error::Missing CLIENT_ID"; exit 1; }
          test -n "$AUTH_SECRET" || { echo "::error::Missing AUTH_SECRET"; exit 1; }
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install DNS-over-TLS dependency
        run: python -m pip install --disable-pip-version-check dnspython==2.7.0
      - name: Test DNS resolver country filtering
        run: python -m unittest discover -s tests -v
      - name: Generate DnsHostsGenerator candidates
        run: python scripts/generate_dns_hosts.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      - name: Build and run tests
        run: mvn -B -ntp clean verify
      - name: Synchronize NextDNS profile
        run: java --enable-preview -jar target/*.jar
      - name: Persist source-managed rewrite manifest
        if: success()
        shell: bash
        run: |
          if git diff --quiet -- state/managed-nextdns-rewrites.txt; then
            echo "Managed rewrite manifest is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/managed-nextdns-rewrites.txt
          git commit -m "chore: update NextDNS managed rewrite manifest [skip ci]"
          git push
